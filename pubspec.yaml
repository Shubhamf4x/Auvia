name: ai_life_utility
description: "Auvia — your life, organized intelligently."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.5.3
  image_picker: ^1.2.0
  path_provider: ^2.1.4
  http: ^1.2.0
  permission_handler: ^11.3.1
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: GGSans
      fonts:
        - asset: assets/fonts/GGSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/GGSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/GGSans-Bold.ttf
          weight: 700
